stages:
  - build
  - push

variables:
  DOCKER_DRIVER: overlay2

build_gateway:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t arlg92/gateway-service:latest ./gateway

build_users:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t arlg92/users-service:latest ./users

build_orders:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t arlg92/orders-service:latest ./orders

push_images:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker push arlg92/gateway-service:latest
    - docker push arlg92/users-service:latest
    - docker push arlg92/orders-service:latest